[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grpclib-nri"
version = "0.1.0"
description = "NRI protocol utilities built on grpclib-ttrpc"
authors = [{ name = "lillecarl", email = "github@lillecarl.com" }]
# PEP 695 generics are 3.12.
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "grpclib-ttrpc",
  # Imported directly, not only through grpclib-ttrpc.
  "grpclib",
  "ttrpc",
  "nri",
  "structlog",
  "typing_extensions",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grpclib_nri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
