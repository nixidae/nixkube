[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grpclib-ttrpc"
version = "0.1.0"
description = "ttrpc server and client built on grpclib primitives"
authors = [{ name = "lillecarl", email = "github@lillecarl.com" }]
# PEP 695 generics are 3.12.
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "grpclib",
  "multidict",
  "structlog",
  "ttrpc",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/grpclib_ttrpc"]
