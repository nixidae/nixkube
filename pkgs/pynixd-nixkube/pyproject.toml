[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynixd-nixkube"
version = "0.1.0"
description = "Nixkube integration for pynixd"

dependencies = [
    "pynixd",
    "kr8s",
    "structlog",
    # Imported directly and not only through pynixd: this package's
    # concurrency is written in anyio.
    "anyio",
    # `config.py` reads its settings through pydantic-settings.
    "pydantic-settings",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
pynixd-nixkube = "pynixd_nixkube.__main__:main"
pynixd-nixkube-central = "pynixd_nixkube.central_main:main"
pynixd-nixkube-builder = "pynixd_nixkube.builder_main:main"

[tool.hatch.build.targets.wheel]
packages = ["pynixd_nixkube"]
